# Tells IndexNow search engines (Bing → ChatGPT search, Copilot) which pages changed, right after
# each successful production deploy on Vercel (ADR-0042). Sends only public URLs; needs no secrets.
name: IndexNow

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every page in the sitemap (first run, or after a large change)"
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Changed since the previous successful production deploy (its date; lastmod is date-only).
      - name: Find the previous production deploy
        id: since
        if: github.event_name == 'deployment_status'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ github.event.deployment.id }}
        run: |
          since=$(date -u +%F)
          for row in $(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=Production&per_page=20" \
              --jq '.[] | "\(.id),\(.created_at)"'); do
            id=${row%%,*}; created=${row#*,}
            [ "$id" = "$CURRENT" ] && continue
            state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq '.[0].state')
            if [ "$state" = "success" ]; then since=${created:0:10}; break; fi
          done
          echo "since=$since" >> "$GITHUB_OUTPUT"

      - name: Submit changed pages
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
          SINCE: ${{ steps.since.outputs.since }}
        run: |
          if [ "$ALL" = "true" ]; then
            node scripts/indexnow.mjs --all
          else
            node scripts/indexnow.mjs --since "${SINCE:-$(date -u +%F)}"
          fi
